<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login | ProCure</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #243238;
        }

        header {
            background: #123f46;
            color: white;
            padding: 20px 8%;
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #123f46;
        }

        p {
            text-align: center;
            color: #667085;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5dc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #ff7849;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e96336;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #123f46;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>ProCure</header>

    <div class="container">
        <h2>Seller Login</h2>
        <p>Log in to find requirements and submit quotations.</p>

        <form id="sellerLoginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <a class="back" href="index.html">← Back to Home</a>
    </div>

    <script>
        document.getElementById("sellerLoginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                alert("Login page design is ready! Backend authentication will be connected later.");
            });
    </script>

</body>
</html>
